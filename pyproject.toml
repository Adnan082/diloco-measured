[project]
name = "diloco-measured"
version = "0.1.0"
description = "Measured, not simulated: a bandwidth-controlled evaluation of semi-synchronous LLM training on commodity Ethernet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# STATUS: [PROPOSED] — dependency set is provisional. Nothing here has been resolved
# or lock-verified yet (CLAUDE.md D2/D4, §40 Q2, §40 Q4). Do not treat versions below
# as pinned; a real lockfile (uv.lock) is Phase 0 work, not done by scaffolding.
dependencies = [
    # measurement/ (needs GPUs + AWS on the actual cluster; importable everywhere for typing/tests)
    "torch>=2.4",
    # "torchtitan @ git+https://github.com/pytorch/torchtitan@<PINNED_SHA>",   # ADR-009, PROPOSED — pin on Day 0
    # "torchft @ git+https://github.com/pytorch/torchft@<PINNED_SHA>",        # §40 Q2, PENDING — pin on Day 0
    "pydantic>=2.7",
    "typer>=0.12",
    # analysis/ (must remain GPU-free — see CLAUDE.md §11.2 forbidden edges)
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
diloco-measured = "diloco_measured.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diloco_measured"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# NOTE: set to 3.12 (not the 3.11 floor in requires-python above) purely so mypy's bundled
# numpy stubs parse cleanly (numpy>=2.5's .pyi uses a `type X = ...` statement gated on
# sys.version_info >= (3, 12); mypy needs a matching target to evaluate that branch). This
# does not change the package's actual minimum supported Python version.
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure logic, fast, every commit",
    "integration_cpu: CPU-only distributed tests (gloo), no GPU, no AWS",
    "e2e: requires a live 4-node cluster (make smoke) — not run in CI",
]
