[project]
name = "diloco-measured"
version = "0.1.0"
description = "Measured, not simulated: a bandwidth-controlled evaluation of semi-synchronous LLM training on commodity Ethernet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# STATUS: [CONFIRMED] — §40 Q2 (torchft/torchtitan pins) validated FOR REAL on live GPU
# hardware 2026-08-14 (ADR-032): torchft's own DiLoCo test suite passes (8/8) and
# torchtitan's debugmodel builds + runs a real forward/backward pass on an L40S, exact
# param-count match to ADR-026. §40 Q4 (Docker vs bare metal) resolved (ADR-020: bare metal).
# A real lockfile (uv.lock) is still Phase 0 work, not done by scaffolding.
# REPIN BEFORE THE REAL CAMPAIGN if this tree is more than a few days old — both projects
# publish continuously (ADR-032 found the torchtitan org had ALSO silently drifted in the
# other direction from what was assumed: it's pytorch/torchtitan, not meta-pytorch/torchtitan
# — meta-pytorch/torchtitan 404s. Re-verify the org, not just the SHA, every time).
dependencies = [
    # measurement/ (needs GPUs + AWS on the actual cluster; importable everywhere for typing/tests)
    "torch>=2.4",
    # torchtitan: pure-Python wheel; PyPI (0.2.2) lags `main` substantially, so pinned to a
    # `main` SHA instead. 624c312b67 = last commit on pytorch/torchtitan main as of
    # 2026-08-14 (ADR-032 validation date) — REAL forward+backward pass verified on an L40S.
    "torchtitan @ git+https://github.com/pytorch/torchtitan@624c312b67",  # ADR-009/ADR-032
    # torchft: has a Rust extension (maturin/PyO3) — building from a git SHA needs a Rust +
    # protobuf-compiler toolchain on every node, confirmed by trying it (see §40 Q2). Pin the
    # prebuilt manylinux_x86_64 nightly wheel instead. 2026.8.14 = latest observed build as of
    # ADR-032's validation date — its own DiLoCo/LocalSGD test suite passes 8/8 on real GPU.
    "torchft-nightly==2026.8.14",   # §40 Q2/ADR-032
    "pydantic>=2.7",
    "typer>=0.12",
    # analysis/ (must remain GPU-free — see CLAUDE.md §11.2 forbidden edges)
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# infra/prepare_dataset.py only — tokenizing/streaming the corpus, a one-off control-node
# step. Deliberately NOT in the base `dependencies`: measurement/ and analysis/ never import
# this, and analysis/ must stay importable with a minimal, GPU-free, network-free dep set
# (CLAUDE.md §11.2).
dataprep = [
    "transformers>=4.40",
    "datasets>=2.19",
]

[project.scripts]
diloco-measured = "diloco_measured.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diloco_measured"]

# Required because `dependencies` above pins torchtitan to a git+https URL (a PEP 508
# "direct reference") rather than a PyPI version -- hatchling refuses to build without this
# explicit opt-in. Found for real 2026-08-14: `uv sync` against the corrected pyproject.toml
# failed on every node except the first (where torchft/torchtitan had been installed as
# separate ad-hoc `uv pip install` calls, never exercising this package's own build step).
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# NOTE: set to 3.12 (not the 3.11 floor in requires-python above) purely so mypy's bundled
# numpy stubs parse cleanly (numpy>=2.5's .pyi uses a `type X = ...` statement gated on
# sys.version_info >= (3, 12); mypy needs a matching target to evaluate that branch). This
# does not change the package's actual minimum supported Python version.
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import infra/prepare_dataset.py (not a src/ package)
markers = [
    "unit: pure logic, fast, every commit",
    "integration_cpu: CPU-only distributed tests (gloo), no GPU, no AWS",
    "e2e: requires a live 4-node cluster (make smoke) — not run in CI",
]
