# Model config: ~1B params. Matches the reference L40S semi-sync setup for comparability
# (ADR-011); used for throughput/CU grid runs (Phase 3), NOT convergence (too slow/expensive
# for repeated overnight runs — see CLAUDE.md §4.5 non-goals, "Models above ~1B parameters").
# STATUS: [PROPOSED] scaffold, [UNKNOWN] dims.

[model]
name = "diloco-1b"
approx_params = 1_000_000_000
architecture = "llama3-style"  # [PROPOSED], pending ADR-009

[model.dims]
dim = 2048              # [UNKNOWN]
n_layers = 24            # [UNKNOWN]
n_heads = 16             # [UNKNOWN]
vocab_size = 32000       # [UNKNOWN]

[train]
seq_len = 1024
micro_batch_size = 2     # [UNKNOWN] — must be validated against 45GiB L40S VRAM on Day 1;
                          # CLAUDE.md §27 flags whether 8 vCPU can feed one L40S as [UNKNOWN]
grad_accum = 4            # [PROPOSED]

[budget]
# Not used for convergence at this size — throughput/CU grid runs are step-budgeted, see
# configs/grids/phase_a.yaml.
grid_steps_per_point = 200  # [PROPOSED] — must fit the <=5min/point NFR-06 target
