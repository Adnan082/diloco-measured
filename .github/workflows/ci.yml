name: CI

# Analysis remains a locked, laptop-sized install. A separate CPU-only job
# exercises reference training and Gloo collectives without AWS or GPUs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (laptop-sized base + dev, from the lockfile, no torch)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Unit tests (excluding requires_torch)
        run: uv run pytest -m "unit and not requires_torch" tests/unit -v

      - name: CPU integration tests (excluding requires_torch)
        run: uv run pytest -m "integration_cpu and not requires_torch" tests/integration_cpu -v

      - name: Regenerate figures from committed results/raw/ (FR-11 — no GPU, no network, no credentials)
        run: uv run diloco-measured figures


  cpu-distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked base and dev dependencies
        run: uv sync --frozen --extra dev
      - name: Install CPU Torch matching uv.lock
        run: uv pip install --python .venv/bin/python torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Reference algorithm and two-rank Gloo tests
        run: .venv/bin/python -m pytest -m requires_torch tests/unit tests/integration_cpu -v
